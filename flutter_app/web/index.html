<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Official St. Cecilia's College alumni portal featuring multi-role authentication, personalized dashboards, verified directories, messaging, events, and institutional administration.">

  <!-- Shared PWA Meta Tags & Theme Matching Web Index -->
  <meta name="theme-color" content="#8B181B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cecilian Alumnet">

  <!-- OpenGraph / Social Share Cards -->
  <meta property="og:title" content="Cecilian Alumnet • St. Cecilia's College">
  <meta property="og:description" content="Cecilian Alumnet is the official alumni network and global collegiate directory for St. Cecilia's College - Cebu, Inc.">
  <meta property="og:type" content="website">

  <!-- Favicons and PWA Icons -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">

  <title>Cecilian Alumnet • St. Cecilia's College</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F9FAFB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #F9FAFB;
      color: #111827;
    }
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #E5E7EB;
      border-top-color: #8B181B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      margin-top: 18px;
      font-size: 15px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.01em;
    }
    .loading-subtitle {
      margin-top: 4px;
      font-size: 11px;
      color: #6B7280;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="loading-spinner"></div>
    <div class="loading-title">St. Cecilia's College</div>
    <div class="loading-subtitle">Global Alumni Portal • Loading Environment...</div>
  </div>

  <script>
    // Service Worker Registration for Offline Capabilities & PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=cecilian-pwa-v1')
          .then(function (registration) {
            console.log('[PWA SW] Registered successfully with scope:', registration.scope);
            registration.onupdatefound = function () {
              const installingWorker = registration.installing;
              installingWorker.onstatechange = function () {
                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[PWA SW] New content available; please refresh.');
                }
              };
            };
          })
          .catch(function (error) {
            console.warn('[PWA SW] Registration failed:', error);
          });
      });
    }

    // Flutter Bootstrap loader
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.transition = 'opacity 0.25s ease-out';
        setTimeout(() => loader.remove(), 250);
      }
    });
  </script>
  <script src="flutter.js" defer></script>
</body>
</html>
